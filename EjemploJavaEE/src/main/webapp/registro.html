<!DOCTYPE html>
<html>

<head>
    <title>Nébula</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./estilos/styles.css" />
</head>

<body>
    <header>
        <a href="./index.html">
            <img src="./imgs/nebula-03.png" alt="logo nébula" width="100" />
        </a>
        <nav>
            <a href="./nosotros.html">Nosotros</a>
            <a href="./registro.html">Registrate</a>
            <a href="./comunidad.html">Comunidad</a>
        </nav>
    </header>
    <main>
        <div id="seccion-titulo">
            <h2>Registro de usuarios</h2>
        </div>

        <div id="seccion-form">
            <form action="/usuarios" method="post">
                <div id="seccion-titulo-form">
                    <h4>Nuevo usuario</h4>
                    <label>Completa la información y envía los datos</label>
                </div>
                <div id="seccion-nombre" class="input-form">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="nombre" minlength="10" maxlength="100"
                        placeholder="Escribe tu nombre" />
                    <span>Tu nombre completo</span>
                </div>
                <div id="seccion-correo" class="input-form">
                    <label for="correo">Correo</label>
                    <input type="email" id="correo" name="correo" required maxlength="200"
                        placeholder="Escribe tu correo" />
                    <span>Tu correo para recibir notificaciones</span>
                </div>
                <div id="seccion-password" class="input-form">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required maxlength="100" />
                    <span>La contraseña para iniciar sesión</span>
                </div>
                <div id="seccion-pseudonimo" class="input-form">
                    <label for="pseudonimo">Pseudónimo</label>
                    <input type="text" id="pseudonimo" name="pseudonimo" pattern="[A-Z]{5}[0-9]{1}" />
                    <span>Tu pseudónimo para identificarte con otros usuarios</span>
                </div>
                <div id="seccion-estado">
                    <label>Estado</label>
                    <input type="radio" value="activo" id="estado_activo" name="estado" required>Activo
                    <input type="radio" value="pendiente" id="estado_pendiente" name="estado">Pendiente
                </div>
                <div id="seccion-cuenta">
                    <label for="cuenta">Cuenta</label>
                    <select id="cuenta" name="cuenta" required>
                        <option value="">-Selecciona-</option>
                        <option value="basica">Básica</option>
                        <option value="estandar">Estándar</option>
                        <option value="premium">Premium</option>
                    </select>
                </div>
                <div id="seccion-fecha-nacimiento">
                    <label for="fecha-nacimiento">Fecha nacimiento</label>
                    <input type="date" id="fecha-nacimiento" name="fecha-nacimiento" required />
                    <span>Tu fecha de nacimiento para recibir promociones</span>
                </div>
                <div id="seccion-terminos">
                    <label for="terminos">Aceptar términos y condiciones</label>
                    <input type="checkbox" id="terminos" name="terminos" required />
                </div>
                <div id="seccion-opciones">
                    <input type="submit" value="Registrar" />
                    <input type="reset" value="Cancelar" />
                </div>
            </form>
        </div>
    </main>
</body>

</html>
